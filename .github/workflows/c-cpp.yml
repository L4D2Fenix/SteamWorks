name: SteamWorks Custom 1.2.4 Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linux 32-bit Dependencies & Clang
      if: runner.os == 'Linux'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib lib32z1-dev libc6-dev-i386 clang

    - name: Install AMBuild
      run: |
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/alliedmodders/ambuild.git

    - name: Clone Required SDK Dependencies
      run: |
        git clone https://github.com/rlabrecque/SteamworksSDK.git SteamworksSDK
        cd SteamworksSDK && git checkout 4d41594#diff-cfb093ce0838f6b6a98c27d3fa7ec8b56400a5e0c832732768c741425124c24d 2>/dev/null || git checkout master
        cd ..
        git clone --depth 1 -b l4d2 https://github.com/alliedmodders/hl2sdk.git hl2sdk-l4d2
        git clone --depth 1 -b 1.11-dev https://github.com/alliedmodders/metamod-source.git mmsource-central
        git clone --depth 1 --recurse-submodules -b 1.11-dev https://github.com/alliedmodders/sourcemod.git sourcemod-central

    - name: Fix SourcePawn and AMTL Include Locations (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p sourcemod-central/public/sourcepawn
        mkdir -p sourcemod-central/public/amtl
        find sourcemod-central -name "sp_vm_types.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/sourcepawn/ 2>/dev/null || true
        find sourcemod-central -name "sp_vm_types.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/ 2>/dev/null || true
        find sourcemod-central -name "am-string.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/amtl/ 2>/dev/null || true
        find sourcemod-central -name "am-string.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/ 2>/dev/null || true

    - name: Fix SourcePawn and AMTL Include Locations (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "sourcemod-central/public/sourcepawn"
        New-Item -ItemType Directory -Force -Path "sourcemod-central/public/amtl"
        Get-ChildItem -Path "sourcemod-central" -Recurse -Filter "sp_vm_types.h" | ForEach-Object { Copy-Item -Path "$($_.DirectoryName)\*" -Destination "sourcemod-central/public/sourcepawn" -Recurse -Force; Copy-Item -Path "$($_.DirectoryName)\*" -Destination "sourcemod-central/public" -Recurse -Force }
        Get-ChildItem -Path "sourcemod-central" -Recurse -Filter "am-string.h" | ForEach-Object { Copy-Item -Path "$($_.DirectoryName)\*" -Destination "sourcemod-central/public/amtl" -Recurse -Force; Copy-Item -Path "$($_.DirectoryName)\*" -Destination "sourcemod-central/public" -Recurse -Force }

    - name: Patch Obsolete Steam API Calls & BuildScript
      run: |
        python -c "
        with open('AMBuildScript', 'r') as f: content = f.read()
        content = content.replace('c++11', 'c++14').replace('-Werror', '')
        with open('AMBuildScript', 'w') as f: f.write(content)

        with open('Extension/gsnatives.cpp', 'r') as f: content = f.read()
        content = content.replace('pServer->ForceHeartbeat();', '// pServer->ForceHeartbeat();')
        with open('Extension/gsnatives.cpp', 'w') as f: f.write(content)
        "

    - name: Run Configure and Build (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir build
        cd build
        python ../configure.py --enable-optimize --sdks=l4d2 --hl2sdk-root=$GITHUB_WORKSPACE --sm-path=$GITHUB_WORKSPACE/sourcemod-central --mms-path=$GITHUB_WORKSPACE/mmsource-central --steamworks-path=$GITHUB_WORKSPACE/SteamworksSDK
        ambuild

    - name: Run Configure and Build (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        mkdir build
        cd build
        python ..\configure.py --enable-optimize --sdks=l4d2 --hl2sdk-root=%GITHUB_WORKSPACE% --sm-path=%GITHUB_WORKSPACE%\sourcemod-central --mms-path=%GITHUB_WORKSPACE%\mmsource-central --steamworks-path=%GITHUB_WORKSPACE%\SteamworksSDK
        ambuild

    - name: Upload Compiled Extension Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SteamWorks-1.2.4-Custom-${{ runner.os }}
        path: build/package/
