name: SteamWorks Custom 1.2.4 Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2019]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linux 32-bit Dependencies & Clang
      if: runner.os == 'Linux'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib lib32z1-dev libc6-dev-i386 clang

    - name: Install AMBuild
      run: |
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/alliedmodders/ambuild.git

    - name: Clone Required SDK Dependencies
      run: |
        mkdir -p assets
        git clone --depth 1 https://github.com/rlabrecque/SteamworksSDK.git assets/SteamworksSDK
        git clone --depth 1 -b l4d2 https://github.com/alliedmodders/hl2sdk.git assets/hl2sdk-l4d2
        git clone --depth 1 -b 1.11-dev https://github.com/alliedmodders/metamod-source.git assets/mmsource-central
        git clone --depth 1 -b 1.11-dev https://github.com/alliedmodders/sourcemod.git assets/sourcemod-central

    - name: Run Configure and Build
      run: |
        mkdir build
        cd build
        python ../configure.py --sdks=l4d2 --hl2sdk-root=../assets --sm-path=../assets/sourcemod-central --mms-path=../assets/mmsource-central --steamworks-path=../assets/SteamworksSDK
        ambuild

    - name: Upload Compiled Extension Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SteamWorks-1.2.4-Custom-${{ runner.os }}
        path: build/package/
