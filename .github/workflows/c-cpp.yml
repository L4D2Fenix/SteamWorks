name: SteamWorks Custom 1.2.4 Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2019]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linux 32-bit Dependencies & Clang
      if: runner.os == 'Linux'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib lib32z1-dev libc6-dev-i386 clang

    - name: Install AMBuild
      run: |
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/alliedmodders/ambuild.git

    - name: Clone Required SDK Dependencies
      run: |
        git clone --depth 1 https://github.com/rlabrecque/SteamworksSDK.git SteamworksSDK
        git clone --depth 1 -b l4d2 https://github.com/alliedmodders/hl2sdk.git hl2sdk-l4d2
        git clone --depth 1 -b sdk2013 https://github.com/alliedmodders/hl2sdk.git hl2sdk-sdk2013
        git clone --depth 1 -b 1.11-dev https://github.com/alliedmodders/metamod-source.git mmsource-central
        git clone --depth 1 --recurse-submodules -b 1.11-dev https://github.com/alliedmodders/sourcemod.git sourcemod-central

    - name: Fix SourcePawn and AMTL Include Locations
      run: |
        mkdir -p sourcemod-central/public/sourcepawn
        mkdir -p sourcemod-central/public/amtl
        find sourcemod-central -name "sp_vm_types.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/sourcepawn/ 2>/dev/null || true
        find sourcemod-central -name "sp_vm_types.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/ 2>/dev/null || true
        find sourcemod-central -name "am-string.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/amtl/ 2>/dev/null || true
        find sourcemod-central -name "am-string.h" -exec dirname {} \; | xargs -I {} cp -r {}/. sourcemod-central/public/ 2>/dev/null || true

    - name: Force C++14 in AMBuildScript (Linux)
      if: runner.os == 'Linux'
      run: |
        sed -i 's/c++11/c++14/g' AMBuildScript

    - name: Run Configure and Build (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir build
        cd build
        python ../configure.py --enable-optimize --sdks=all --hl2sdk-root=$GITHUB_WORKSPACE --sm-path=$GITHUB_WORKSPACE/sourcemod-central --mms-path=$GITHUB_WORKSPACE/mmsource-central --steamworks-path=$GITHUB_WORKSPACE/SteamworksSDK
        ambuild

    - name: Run Configure and Build (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        mkdir build
        cd build
        python ..\configure.py --enable-optimize --sdks=all --hl2sdk-root=%GITHUB_WORKSPACE% --sm-path=%GITHUB_WORKSPACE%\sourcemod-central --mms-path=%GITHUB_WORKSPACE%\mmsource-central --steamworks-path=%GITHUB_WORKSPACE%\SteamworksSDK
        ambuild

    - name: Upload Compiled Extension Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SteamWorks-1.2.4-Custom-${{ runner.os }}
        path: build/package/
